[package]
name = "bergshamra-keys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Key management for Bergshamra XML Security library"

[features]
default = ["rustcrypto", "legacy-algorithms", "post-quantum", "pkcs11"]
# Key loading without PKCS#12, encrypted PKCS#8 (pkcs5/scrypt) or the
# RustCrypto post-quantum crates. The small EdDSA/X25519/DSA/DH key types
# stay, because `KeyData` variants are matched across the dsig/enc crates.
rustcrypto-verify = [
    "kryptering/rustcrypto-core",
    "bergshamra-crypto/rustcrypto-verify",
    "tsp-ltv/rustcrypto-verify",
    "dep:rsa",
    "dep:ecdsa",
    "dep:p256",
    "dep:p384",
    "dep:p521",
    "dep:pkcs1",
    "dep:signature",
    "dep:ed25519-dalek",
    "dep:x25519-dalek",
    "dep:dsa",
    "dep:num-bigint-dig",
    "dep:num-traits",
]
pkcs12 = ["dep:bergshamra-pkcs12"]
rustcrypto = [
    "rustcrypto-verify",
    "pkcs12",
    "kryptering/rustcrypto",
    "bergshamra-crypto/rustcrypto",
    "bergshamra-pkcs12/rustcrypto",
    "tsp-ltv/rustcrypto",
    # These crates are only used to derive public components while importing
    # PQ private keys into the RustCrypto adapter.  Merely enabling the
    # provider-neutral `post-quantum` URI/API surface with another provider
    # must not pull RustCrypto primitive implementations into that build.
    "dep:ml-dsa",
    "dep:slh-dsa",
    "dep:pkcs8-pq",
    "dep:const-oid-pq",
    "encrypted-pkcs8",
]
# Password-protected PKCS#8 PEM ("ENCRYPTED PRIVATE KEY").
encrypted-pkcs8 = ["pkcs8/encryption", "pkcs8/3des", "pkcs8/sha1-insecure"]
aws-lc = ["pkcs12", "kryptering/aws-lc", "bergshamra-crypto/aws-lc", "bergshamra-pkcs12/aws-lc", "tsp-ltv/aws-lc"]
fips = ["aws-lc", "kryptering/fips", "bergshamra-crypto/fips", "bergshamra-pkcs12?/fips", "tsp-ltv/fips"]
post-quantum = [
    "kryptering/post-quantum",
    "bergshamra-crypto/post-quantum",
]
pkcs11 = ["kryptering/pkcs11", "bergshamra-crypto/pkcs11"]
# Accept weak/legacy digests (MD5/SHA-1/SHA-224) in X.509 certificate-chain
# verification, for historical XML-DSig interop material. Off by default
# (strict, fail-closed). See `x509::cert_signature_policy`.
legacy-algorithms = [
    "bergshamra-crypto/legacy-algorithms",
    "bergshamra-pkcs12?/legacy-algorithms",
    "tsp-ltv/legacy-algorithms",
]

[dependencies]
bergshamra-core.workspace = true
bergshamra-crypto.workspace = true
kryptering.workspace = true
ed25519-dalek = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }
rsa = { workspace = true, optional = true }
ecdsa = { workspace = true, optional = true }
dsa = { workspace = true, optional = true }
ml-dsa = { workspace = true, optional = true }
slh-dsa = { workspace = true, optional = true }
p256 = { workspace = true, features = ["ecdsa"], optional = true }
p384 = { workspace = true, features = ["ecdsa"], optional = true }
p521 = { workspace = true, features = ["ecdsa"], optional = true }
pkcs1 = { workspace = true, optional = true }
pkcs8 = { version = "0.10", features = ["std", "pem"] }
pkcs8-pq = { workspace = true, optional = true }
const-oid-pq = { workspace = true, optional = true }
spki.workspace = true
der.workspace = true
pem-rfc7468.workspace = true
x509-cert.workspace = true
bergshamra-pkcs12 = { workspace = true, optional = true }
base64.workspace = true
num-bigint-dig = { workspace = true, optional = true }
num-traits = { workspace = true, optional = true }
signature = { workspace = true, optional = true }
uppsala.workspace = true
tsp-ltv.workspace = true
zeroize.workspace = true

[dev-dependencies]
rand.workspace = true
